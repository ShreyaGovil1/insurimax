[project]
name = "backend"
version = "0.1.0"
description = "DischargePulse - AI-powered insurance claims adjudication backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database - Cloud SQL (PostgreSQL-compatible, works with AlloyDB too)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",

    # Google Cloud Platform
    "google-cloud-storage>=2.16.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-generativeai>=0.8.0",
    "google-auth>=2.29.0",
    "google-cloud-secret-manager>=2.20.0",

    # LangChain (already in project)
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-google-vertexai>=1.0.0",

    # Data validation & serialization
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # HTTP client
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "uuid7>=0.1.0",
    "aiofiles>=23.2.0",
    "Pillow>=10.3.0",
    "pypdf>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]
