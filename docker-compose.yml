services:
  frontend:
    build:
      context: ./Frontend
      args:
        # Show the demo persona buttons on the sign-in page (local demo only)
        VITE_DEMO_PERSONAS: "true"
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # This URL is used by the browser, so it must be reachable from the
      # host machine — localhost:8000 is correct when the API port is exposed.
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

  api:
    build:
      context: ./Backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      # Documents go to the real GCS bucket in Backend/.env (GCS_BUCKET_NAME), authenticated with
      # the service-account key at GOOGLE_APPLICATION_CREDENTIALS (Backend/keys/, mounted below).
      # Do not set STORAGE_EMULATOR_HOST here: the GCS client then routes everything, including
      # signed preview URLs, to the emulator host, which browsers can't reach.
      # Allow requests from the frontend container and local dev
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173","http://127.0.0.1:8080"]'
    volumes:
      - ./Backend:/app        # live code reload in dev
      - /app/.venv            # keep the image's venv intact
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
